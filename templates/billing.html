<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billing - Dokan</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-control { margin-bottom: 10px; padding: 8px; width: 200px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-primary { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .btn-danger { padding: 5px 10px; background: red; color: white; border: none; cursor: pointer; }
        .total-section { margin-top: 20px; font-size: 1.2em; font-weight: bold; }
        .action-buttons { margin-top: 15px; }
        .action-buttons button { margin-right: 10px; }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <h1>Billing</h1>
    <a href="/logout">Logout</a>

    <div style="margin-bottom: 20px; border: 1px solid #ccc; padding: 20px;" class="no-print">
        <h3>New Bill</h3>
        <input type="text" id="customerName" class="form-control" placeholder="Customer Name">
        <button class="btn-primary" onclick="addItemRow()">+ Add Item</button>
    </div>

    <table id="billTable">
        <thead>
            <tr>
                <th>S.No</th>
                <th>Item</th>
                <th>Qty</th>
                <th>Price (₹)</th>
                <th>Stock</th>
                <th class="no-print">Action</th>
            </tr>
        </thead>
        <tbody id="billBody">
            <!-- Rows will be added here -->
        </tbody>
    </table>

    <div class="total-section">
        Total: ₹<span id="billTotal">0.00</span>
    </div>

    <div class="action-buttons no-print">
        <button class="btn-primary" onclick="generateBill()">Generate Bill</button>
        <button class="btn-primary" onclick="window.print()">🖨️ Print Bill</button>
        <button class="btn-primary" onclick="downloadInventory()">Download Inventory CSV</button>
    </div>
    <script>
        // Load inventory from backend API
        let inventory = [];

        async function loadInventory() {
            try {
                const response = await fetch('/api/inventory');
                if (response.ok) {
                    inventory = await response.json();
                    // Update any existing dropdowns
                    updateAllItemDropdowns();
                } else {
                    console.error('Failed to load inventory');
                }
            } catch (error) {
                console.error('Error loading inventory:', error);
            }
        }

        function addItemRow() {
            const tbody = document.getElementById('billBody');
            const row = tbody.insertRow();
            const idx = tbody.rows.length;

            row.insertCell(0).innerText = idx + 1;

            // Item dropdown
            let itemCell = row.insertCell(1);
            let itemSelect = document.createElement('select');
            itemSelect.innerHTML = '<option value="">Select item</option>';
            inventory.forEach(item => {
                itemSelect.innerHTML += `<option value="${item.name}">${item.name}</option>`;
            });
            itemSelect.onchange = function() {
                const invItem = inventory.find(x => x.name === itemSelect.value);
                if (invItem) {
                    priceInput.value = invItem.price;
                    stockCell.innerText = invItem.stock;
                    qtyInput.max = invItem.stock;
                } else {
                    priceInput.value = 0;
                    stockCell.innerText = '-';
                    qtyInput.max = '';
                }
                updateTotal();
            };
            itemCell.appendChild(itemSelect);

            // Qty
            let qtyCell = row.insertCell(2);
            let qtyInput = document.createElement('input');
            qtyInput.type = "number";
            qtyInput.value = 1;
            qtyInput.min = 1;
            qtyInput.oninput = function() {
                const invItem = inventory.find(x => x.name === itemSelect.value);
                if (invItem && Number(qtyInput.value) > Number(invItem.stock)) {
                    qtyInput.value = invItem.stock;
                }
                updateTotal();
            };
            qtyCell.appendChild(qtyInput);

            // Price
            let priceCell = row.insertCell(3);
            let priceInput = document.createElement('input');
            priceInput.type = "number";
            priceInput.value = 0;
            priceInput.min = 0;
            priceInput.step = "0.01";
            priceInput.readOnly = true;
            priceCell.appendChild(priceInput);

            // Stock display
            let stockCell = row.insertCell(4);
            stockCell.innerText = '-';

            // Remove Button
            let actCell = row.insertCell(5);
            let rmBtn = document.createElement('button');
            rmBtn.innerText = "✖";
            rmBtn.className = "btn-danger";
            rmBtn.onclick = function() {
                tbody.removeChild(row);
                updateRowNumbers();
                updateTotal();
            };
            actCell.appendChild(rmBtn);

            updateRowNumbers();
            updateTotal();
        }

        function updateRowNumbers() {
            const tbody = document.getElementById('billBody');
            for (let i = 0; i < tbody.rows.length; i++) {
                tbody.rows[i].cells[0].innerText = i + 1;
            }
        }
        function updateTotal() {
            const tbody = document.getElementById('billBody');
            let total = 0;
            for (let i = 0; i < tbody.rows.length; i++) {
                let qty = parseFloat(tbody.rows[i].cells[2].firstChild.value) || 0;
                let price = parseFloat(tbody.rows[i].cells[3].firstChild.value) || 0;
                total += price * qty;
            }
            document.getElementById('billTotal').innerText = total.toFixed(2);
        }
        
        async function generateBill() {
            const tbody = document.getElementById('billBody');
            const customerName = document.getElementById('customerName').value || 'Unknown';
            
            // Collect items from the bill
            let cartItems = [];
            for (let i = 0; i < tbody.rows.length; i++) {
                let itemName = tbody.rows[i].cells[1].firstChild.value;
                let qty = parseFloat(tbody.rows[i].cells[2].firstChild.value) || 0;
                
                if (!itemName || qty <= 0) continue;
                
                let invItem = inventory.find(x => x.name === itemName);
                if (invItem) {
                    if (qty > Number(invItem.stock)) {
                        alert(`Not enough stock for item: ${itemName}`);
                        return;
                    }
                    cartItems.push({
                        id: invItem.id,
                        name: invItem.name,
                        qty: qty,
                        price: invItem.price
                    });
                }
            }
            
            if (cartItems.length === 0) {
                alert('Please add items to the bill');
                return;
            }
            
            // Send checkout request to backend
            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customer_name: customerName,
                        items: cartItems
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`Bill generated successfully! Transaction ID: ${result.transaction_id}`);
                    // Reload inventory to get updated stock values
                    await loadInventory();
                    // Clear the bill table
                    tbody.innerHTML = '';
                    addItemRow();
                    updateTotal();
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (error) {
                console.error('Checkout error:', error);
                alert('Failed to process checkout. Please try again.');
            }
        }

        function updateAllItemDropdowns() {
            const tbody = document.getElementById('billBody');
            for (let i = 0; i < tbody.rows.length; i++) {
                let itemCell = tbody.rows[i].cells[1];
                let oldSelect = itemCell.firstChild;
                let selected = oldSelect.value;
                let newSelect = document.createElement('select');
                newSelect.innerHTML = '<option value="">Select item</option>';
                inventory.forEach(item => {
                    newSelect.innerHTML += `<option value="${item.name}"${item.name === selected ? ' selected' : ''}>${item.name}</option>`;
                });
                newSelect.onchange = oldSelect.onchange;
                itemCell.replaceChild(newSelect, oldSelect);
            }
        }

        function downloadInventory() {
            const headers = ["id","name","category","stock","price","expiry_date","supplier"];
            const lines = [headers.join(",")];
            inventory.forEach(row => {
                lines.push(headers.map(h => row[h]).join(","));
            });
            const csv = lines.join("\n");
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'updated_inventory.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Load inventory and add one row by default
        window.onload = async function() {
            await loadInventory();
            addItemRow();
        }
    </script>
</body>
</html>
